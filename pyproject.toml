[project]
name = "bitsrun-macos"
version = "0.1.0"
description = "Event-driven BIT Ethernet login for macOS"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]
readme = "README.md"
license = {text = "WTFPL"}

[project.scripts]
bitsrun-auto = "bitsrun.auto:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
